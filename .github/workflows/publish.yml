name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag/ref to check out for manual dispatch (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Verify release ref matches package version
        shell: bash
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            release_tag="${RELEASE_REF#refs/tags/}"
          elif [[ "$RELEASE_REF" == v* ]]; then
            release_tag="$RELEASE_REF"
          else
            echo "Expected a release tag or tag ref, got '$RELEASE_REF'." >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$release_tag" != "v$package_version" ]]; then
            echo "Selected release tag '$release_tag' does not match package.json version 'v$package_version'." >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Verify release ref matches package version
        shell: bash
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            release_tag="${RELEASE_REF#refs/tags/}"
          elif [[ "$RELEASE_REF" == v* ]]; then
            release_tag="$RELEASE_REF"
          else
            echo "Expected a release tag or tag ref, got '$RELEASE_REF'." >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$release_tag" != "v$package_version" ]]; then
            echo "Selected release tag '$release_tag' does not match package.json version 'v$package_version'." >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Node 22's bundled npm (10.x) is below the 11.5.1 minimum required for
      # OIDC trusted publishing (npmjs.com). Upgrade npm here (publish job
      # only — test doesn't need it) so OIDC auth can work at all.
      - run: npm install -g npm@latest

      - run: npm pack --dry-run

      # OIDC trusted publishing (npmjs.com) is the auth path for this workflow;
      # npm tries OIDC first and only falls back to _authToken if that fails,
      # so this doesn't affect the OIDC path either way. NODE_AUTH_TOKEN is set
      # to an EXPLICIT empty string (not omitted): actions/setup-node always
      # writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and per npm's own
      # docs an env var that is truly undefined is left as the literal
      # unresolved "${NODE_AUTH_TOKEN}" string (a bogus non-empty token),
      # whereas a defined-but-empty var substitutes cleanly to "". A clean ""
      # resolves to no classic token (clean ENEEDAUTH if OIDC isn't configured
      # yet); an unresolved placeholder would be sent as a literal invalid
      # token instead, which registries reject with a more confusing error.
      # `prepare` builds dist/ automatically before publish.
      - run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ''
